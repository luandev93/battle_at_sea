<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battle at Sea - Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="login-screen" id="login-screen">
        <div class="login-panel">
          <div class="brand">
            <div class="brand-icon">⚓</div>
            <div>
              <h1>Battle at Sea</h1>
              <p>Autentique-se para entrar no lobby naval</p>
            </div>
          </div>

          <form id="login-form" class="login-form" novalidate>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" autocomplete="username" required />

            <label for="password">Senha</label>
            <div class="password-row">
              <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" id="toggle-password" class="toggle-password" aria-label="Mostrar senha">Mostrar</button>
            </div>
            <div id="caps-lock-warning" class="form-note caps-warning" hidden>Caps Lock ativado</div>

            <div class="form-footer">
              <label class="checkbox-field">
                <input type="checkbox" id="remember-me" />
                Lembrar neste dispositivo
              </label>
              <button type="button" id="forgot-password-button" class="text-button">Esqueci minha senha</button>
            </div>

            <div id="error-message" class="error-message" aria-live="polite"></div>

            <div class="button-row">
              <button type="button" id="sign-in-button" class="primary-button">Entrar</button>
              <button type="button" id="sign-up-button" class="secondary-button">Criar Conta</button>
            </div>
          </form>
        </div>
      </div>

      <div class="lobby-screen hidden" id="lobby-screen">
        <div class="lobby-panel">
          <h2>Escolha seu modo de batalha</h2>
          <p>Jogue contra um bot inteligente ou encontre um oponente online.</p>
          <div class="button-row">
            <button type="button" id="start-solo-button" class="primary-button">Jogar Solo</button>
          </div>
        </div>
      </div>

      <div class="battle-screen hidden" id="battle-screen">
        <div class="battle-shell">
          <div class="battle-top">
            <div id="ammo-counter" class="ammo-counter" aria-label="Contador de munição">
              <span class="ammo-label">Munição</span>
              <span class="ammo-value">12</span>
            </div>
            <div id="battle-status" class="battle-status" aria-live="polite">Aguardando inicío...</div>
          </div>

          <div class="board-frame">
            <div id="board" class="board" aria-label="Mapa tático de batalha">
